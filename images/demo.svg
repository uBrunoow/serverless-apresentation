<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-labelledby="t">
  <title id="t">Upload de imagem serverless: o celular envia foto.jpg para o bucket de entrada no S3; o evento de criação dispara a função Lambda, que grava a miniatura em outro bucket e o registro no DynamoDB.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10" fill="none" stroke="#9AA4B8" stroke-width="1.6"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10" fill="none" stroke="#FD5750" stroke-width="1.6"/>
    </marker>
    <style>
      .lb{font-family:"JetBrains Mono",ui-monospace,"DejaVu Sans Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;fill:#9AA4B8;text-anchor:middle}
      .sub{font-family:"JetBrains Mono",ui-monospace,"DejaVu Sans Mono",monospace;font-size:10.5px;fill:#5E6879;text-anchor:middle}
      .tag{font-family:"JetBrains Mono",ui-monospace,"DejaVu Sans Mono",monospace;font-size:10px;fill:#EEF1F6}
      .hi{fill:#FD5750}
      .bx{fill:#151A23;stroke:#EEF1F6;stroke-opacity:.18;stroke-width:1.4}
      .ic{fill:none;stroke:#EEF1F6;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
      .ln{fill:none;stroke:#9AA4B8;stroke-width:1.6}
      .step{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.1em;fill:#5E6879}
    </style>
  </defs>

  <!-- região AWS -->
  <rect x="132.5" y="24.5" width="371" height="360" fill="none" stroke="#FD5750" stroke-width="1.2" stroke-dasharray="6 6" opacity=".85"/>
  <rect x="132.5" y="24.5" width="371" height="360" fill="#FD5750" opacity=".025"/>
  <text class="step" x="148" y="46" style="fill:#FD5750">AWS · us-east-1</text>

  <!-- 01 celular -->
  <g transform="translate(60 112)">
    <text class="step" x="-30" y="-52">01</text>
    <g class="ic"><rect x="-16" y="-32" width="32" height="64" rx="4"/><path d="M-6-24h12"/><rect x="-9" y="-12" width="18" height="16"/><path d="M-9 0l5-5 4 4 3-3 6 6"/></g>
    <text class="lb" x="0" y="56">Aplicativo</text>
    <text class="sub" x="0" y="70">envia a foto</text>
  </g>

  <!-- foto.jpg -> bucket de entrada -->
  <path class="ln" d="M84 112H166" marker-end="url(#a)"/>
  <g transform="translate(125 100)"><rect x="-26" y="-10" width="52" height="16" fill="#0B0E14"/><text class="tag" x="0" y="2" text-anchor="middle">foto.jpg</text></g>

  <!-- 02 bucket de entrada -->
  <g transform="translate(210 112)">
    <text class="step" x="-36" y="-52">02</text>
    <rect class="bx" x="-36" y="-36" width="72" height="72"/>
    <g class="ic" transform="scale(1.5)"><path d="M-12-12h24l-2.5 24h-19z"/><path d="M-12-5h24"/></g>
    <text class="lb" x="0" y="56">Amazon S3</text>
    <text class="sub" x="0" y="70">bucket de entrada</text>
  </g>

  <!-- 03 evento -> lambda -->
  <path class="ln" d="M246 112H328" stroke="#FD5750" marker-end="url(#ac)"/>
  <g transform="translate(287 112)">
    <rect x="-15" y="-15" width="30" height="30" fill="#0B0E14"/>
    <path d="M2-12L-6 0h5l-1 11 8-12H1z" fill="none" stroke="#FD5750" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text class="step" x="326" y="68" text-anchor="end" style="fill:#FD5750">03 · ObjectCreated</text>

  <!-- 04 lambda -->
  <g transform="translate(372 112)">
    <text class="step" x="-36" y="-52">04</text>
    <rect class="bx" x="-36" y="-36" width="72" height="72" stroke="#FD5750" stroke-opacity="1"/>
    <text x="0" y="10" font-family="JetBrains Mono,ui-monospace,monospace" font-size="30" fill="#FD5750" text-anchor="middle">λ</text>
    <text class="lb hi" x="0" y="56">AWS Lambda</text>
    <text class="sub" x="0" y="70">redimensiona</text>
  </g>

  <!-- 05 saídas -->
  <path class="ln" d="M372 190V220H296V254" marker-end="url(#a)"/>
  <path class="ln" d="M372 190V220H448V254" marker-end="url(#a)"/>
  <g transform="translate(296 236)"><rect x="-30" y="-9" width="60" height="16" fill="#10141C"/><text class="tag" x="0" y="3" text-anchor="middle">thumb.jpg</text></g>
  <g transform="translate(448 236)"><rect x="-34" y="-9" width="68" height="16" fill="#10141C"/><text class="tag" x="0" y="3" text-anchor="middle">{ id, url }</text></g>

  <text class="step" x="248" y="254">05</text>

  <g transform="translate(296 300)">
    <rect class="bx" x="-36" y="-36" width="72" height="72"/>
    <g class="ic" transform="scale(1.5)"><path d="M-12-12h24l-2.5 24h-19z"/><path d="M-12-5h24"/></g>
    <g class="ic" transform="translate(6 6)"><rect x="0" y="0" width="14" height="12" fill="#151A23"/><path d="M0 9l4-4 3 3 2-2 5 5"/></g>
    <text class="lb" x="0" y="56">Amazon S3</text>
    <text class="sub" x="0" y="70">bucket de miniaturas</text>
  </g>

  <g transform="translate(448 300)">
    <rect class="bx" x="-36" y="-36" width="72" height="72"/>
    <g class="ic"><ellipse cx="0" cy="-14" rx="16" ry="6"/><path d="M-16-14V14c0 3.3 7.2 6 16 6s16-2.7 16-6V-14"/><path d="M-16 0c0 3.3 7.2 6 16 6s16-2.7 16-6"/></g>
    <text class="lb" x="0" y="56">DynamoDB</text>
    <text class="sub" x="0" y="70">registro</text>
  </g>
</svg>
